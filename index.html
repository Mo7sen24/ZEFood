<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRIME BITES | Luxury Digital Menu</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/line-awesome/1.3.0/line-awesome/css/line-awesome.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-main: #0c0f12;
            --bg-card: rgba(22, 27, 34, 0.75);
            --bg-glass: rgba(255, 255, 255, 0.03);
            --accent-gold: #e5a93c;
            --accent-gold-hover: #f5b94c;
            --accent-red: #ff3b30;
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --border-glass: rgba(255, 255, 255, 0.08);
            --radius-main: 20px;
            --shadow-premium: 0 20px 40px rgba(0, 0, 0, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Readex Pro', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            padding-bottom: 120px;
            overflow-x: hidden;
        }

        .ambient-glow {
            position: fixed;
            top: -150px;
            right: -150px;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(229, 169, 60, 0.12) 0%, rgba(0,0,0,0) 70%);
            z-index: -1;
            pointer-events: none;
        }

        header {
            position: relative;
            padding: 40px 24px 20px;
            background: linear-gradient(180deg, rgba(12,15,18,0.3) 0%, var(--bg-main) 100%), 
                        url('https://images.unsplash.com/photo-1544025162-d76694265947?w=1200') center/cover;
            border-bottom: 1px solid var(--border-glass);
        }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(229, 169, 60, 0.15);
            border: 1px solid rgba(229, 169, 60, 0.3);
            color: var(--accent-gold);
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 600;
            backdrop-filter: blur(10px);
            margin-bottom: 15px;
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #fff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        /* Search Bar */
        .search-wrapper {
            padding: 0 24px;
            margin-top: 15px;
            max-width: 800px;
            margin: 15px auto 0;
        }

        .search-box {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: 14px;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .search-box input {
            background: transparent;
            border: none;
            color: white;
            width: 100%;
            outline: none;
            font-size: 0.9rem;
        }

        /* Categories Bar */
        .categories-wrapper {
            position: sticky;
            top: 0;
            z-index: 40;
            background: rgba(12, 15, 18, 0.88);
            backdrop-filter: blur(20px);
            padding: 16px 24px;
            border-bottom: 1px solid var(--border-glass);
        }

        .categories {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            scrollbar-width: none;
            max-width: 800px;
            margin: 0 auto;
        }

        .categories::-webkit-scrollbar { display: none; }

        .cat-btn {
            background: var(--bg-glass);
            border: 1px solid var(--border-glass);
            color: var(--text-secondary);
            padding: 10px 18px;
            border-radius: 14px;
            font-size: 0.85rem;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .cat-btn.active {
            background: var(--accent-gold);
            color: #000;
            border-color: var(--accent-gold);
            box-shadow: 0 8px 20px rgba(229, 169, 60, 0.25);
        }

        .main-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 24px;
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 30px 0 16px;
        }

        .section-header h2 {
            font-size: 1.25rem;
            font-weight: 700;
        }

        .product-card {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-main);
            padding: 14px;
            margin-bottom: 14px;
            display: flex;
            gap: 14px;
            backdrop-filter: blur(12px);
            transition: transform 0.2s, border-color 0.2s;
        }

        .product-card:hover {
            border-color: rgba(229, 169, 60, 0.3);
            transform: translateY(-2px);
        }

        .product-img-wrapper {
            width: 100px;
            height: 100px;
            border-radius: 14px;
            overflow: hidden;
            flex-shrink: 0;
        }

        .product-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-title {
            font-size: 0.98rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .product-desc {
            font-size: 0.78rem;
            color: var(--text-secondary);
            line-height: 1.35;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .product-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }

        .product-price {
            font-size: 1.05rem;
            font-weight: 800;
            color: var(--accent-gold);
        }

        .add-action-btn {
            background: var(--bg-glass);
            border: 1px solid var(--border-glass);
            color: var(--text-primary);
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.3s;
            font-size: 1.1rem;
        }

        .add-action-btn:hover {
            background: var(--accent-gold);
            color: #000;
            border-color: var(--accent-gold);
        }

        /* Bottom Nav Bar */
        .bottom-nav {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 32px);
            max-width: 600px;
            background: rgba(22, 27, 34, 0.92);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 22px;
            padding: 12px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow-premium);
            z-index: 50;
        }

        .cart-status {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .cart-icon-wrapper {
            position: relative;
            background: var(--accent-gold);
            color: #000;
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
        }

        .cart-count {
            position: absolute;
            top: -5px;
            right: -5px;
            background: var(--accent-red);
            color: white;
            font-size: 0.7rem;
            font-weight: bold;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cart-total-text { font-size: 0.72rem; color: var(--text-secondary); }
        .cart-total-val { font-size: 1.05rem; font-weight: 800; color: #fff; }

        .view-cart-btn {
            background: linear-gradient(135deg, var(--accent-gold) 0%, #c48b28 100%);
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Cart & Options Drawers */
        .drawer-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(10px);
            z-index: 100;
            display: none;
            justify-content: flex-end;
        }

        .drawer-content {
            width: 100%;
            max-width: 480px;
            height: 100%;
            background: #12161b;
            border-right: 1px solid var(--border-glass);
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--border-glass);
        }

        .drawer-close {
            background: var(--bg-glass);
            border: 1px solid var(--border-glass);
            color: #fff;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            cursor: pointer;
        }

        .cart-items-list {
            flex: 1;
            overflow-y: auto;
            margin: 16px 0;
        }

        .cart-item {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            padding: 10px 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .quantity-controls {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(0,0,0,0.3);
            padding: 4px;
            border-radius: 8px;
        }

        .qty-btn {
            background: var(--bg-glass);
            border: none;
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 4px;
            cursor: pointer;
        }

        .form-input {
            width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            color: white;
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 0.85rem;
            margin-bottom: 8px;
            outline: none;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
            z-index: 110;
            display: none;
            align-items: flex-end;
            justify-content: center;
        }

        .modal-box {
            background: #161b22;
            border: 1px solid var(--border-glass);
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            width: 100%;
            max-width: 600px;
            padding: 20px;
            max-height: 85vh;
            overflow-y: auto;
        }

        .opt-group-title {
            font-size: 0.82rem;
            color: var(--accent-gold);
            margin: 14px 0 8px;
        }

        .opt-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            font-size: 0.88rem;
        }

        .opt-row input { accent-color: var(--accent-gold); width: 16px; height: 16px; }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>

    <header>
        <div class="brand-badge"><i class="las la-crown"></i> التجربة الذهبية</div>
        <h1>PRIME BITES</h1>
        <p>قائمة المأكولات والمشروبات الفاخرة</p>

        </div>
    </div>

    <div class="categories-wrapper">
        <div class="categories" id="categories-container">
            <!-- Rendered by JS -->
        </div>
    </div>

    <div class="main-container" id="menu-sections">
        <!-- Products Rendered via JS -->
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="bottom-nav">
        <div class="cart-status">
            <div class="cart-icon-wrapper">
                <i class="las la-shopping-bag"></i>
                <div class="cart-count" id="cart-badge-count">0</div>
            </div>
            <div>
                <div class="cart-total-text">السلة الحالية</div>
                <div class="cart-total-val" id="cart-bottom-total">0 ج.م</div>
            </div>
        </div>
        <button class="view-cart-btn" onclick="toggleCartDrawer(true)">
            مراجعة الطلب <i class="las la-arrow-left"></i>
        </button>
    </div>

    <!-- Cart Drawer -->
    <div class="drawer-overlay" id="cart-drawer">
        <div class="drawer-content">
            <div class="drawer-header">
                <h3>سلة الطلبات (<span id="drawer-item-count">0</span>)</h3>
                <button class="drawer-close" onclick="toggleCartDrawer(false)">✕</button>
            </div>

            <div class="cart-items-list" id="drawer-cart-items"></div>

            <div style="border-top: 1px solid var(--border-glass); padding-top: 12px;">
                <input type="text" class="form-input" id="c-name" placeholder="الاسم الكامل">
                <input type="tel" class="form-input" id="c-phone" placeholder="رقم الموبايل">
                <input type="text" class="form-input" id="c-address" placeholder="العنوان بالتفصيل">
                <button class="view-cart-btn" style="width:100%; justify-content:center; background:#25D366; color:white;" onclick="processWhatsAppOrder()">
                    إرسال الطلب للواتساب <i class="lab la-whatsapp" style="font-size:1.1rem"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Options Modal -->
    <div class="modal-overlay" id="options-modal">
        <div class="modal-box">
            <div class="drawer-header">
                <h3 id="modal-product-title">تخصيص الوجبة</h3>
                <button class="drawer-close" onclick="closeOptionsModal()">✕</button>
            </div>
            <div id="modal-options-body"></div>
            <button class="view-cart-btn" style="width:100%; justify-content:center; margin-top:16px;" onclick="addCurrentItemToCart()">
                إضافة للسلة 🛒

            { id: 50, cat: 'desserts', title: 'طبق فواكه استوائية طازجة', desc: 'تشكيلة من الفواكه الموسمية مع صوص العسل والنعناع', price: 85, img: 'https://images.unsplash.com/photo-1490474418585-ba9bad8fd0ea?w=300' }
        ];

        let cart = [];
        let activeTempItem = null;
        let selectedCategory = 'all';

        // Render Categories Navigation
        function renderCategories() {
            const container = document.getElementById('categories-container');
            container.innerHTML = categories.map(cat => `
                <button class="cat-btn ${cat.id === 'all' ? 'active' : ''}" onclick="filterCat('${cat.id}', this)">
                    <i class="las ${cat.icon}"></i> ${cat.title}
                </button>
            `).join('');
        }

        // Render Products List
        function renderProducts(items) {
            const container = document.getElementById('menu-sections');
            container.innerHTML = '';

            if (items.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding:40px; color:var(--text-secondary);">لا توجد أصناف مطابقة للبحث 🔍</div>`;
                return;
            }

            // Group by category if 'all' selected
            const activeCats = selectedCategory === 'all' 
                ? categories.filter(c => c.id !== 'all')
                : categories.filter(c => c.id === selectedCategory);

            activeCats.forEach(cat => {
                const catProducts = items.filter(p => p.cat === cat.id);
                if (catProducts.length > 0) {
                    let sectionHtml = `
                        <div class="section-header">
                            <i class="las ${cat.icon}" style="color:var(--accent-gold); font-size: 1.3rem;"></i>
                            <h2>${cat.title}</h2>
                        </div>
                    `;

                    catProducts.forEach(p => {
                        sectionHtml += `
                            <div class="product-card">
                                <div class="product-img-wrapper">
                                    <img src="${p.img}" class="product-img" loading="lazy">
                                </div>
                                <div class="product-info">
                                    <div>
                                        <div class="product-title">${p.title}</div>
                                        <div class="product-desc">${p.desc}</div>
                                    </div>
                                    <div class="product-bottom">
                                        <div class="product-price">${p.price} ج.م</div>
                                        <button class="add-action-btn" onclick="openOptionsModal(${p.id})"><i class="las la-plus"></i></button>
                                    </div>
                                </div>
                            </div>
                        `;
                    });

                    container.innerHTML += sectionHtml;
                }
            });
        }

        function filterCat(catId, btn) {
            selectedCategory = catId;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            handleSearch();
        }

        function handleSearch() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const filtered = productsData.filter(p => {
                const matchesCat = (selectedCategory === 'all' || p.cat === selectedCategory);
                const matchesSearch = p.title.toLowerCase().includes(query) || p.desc.toLowerCase().includes(query);
                return matchesCat && matchesSearch;
            });
            renderProducts(filtered);
        }

        // Options Modal logic
        function openOptionsModal(prodId) {
            const product = productsData.find(p => p.id === prodId);
            activeTempItem = { ...product, selectedExtras: [], finalPrice: product.price };
            
            document.getElementById('modal-product-title').innerText = product.title;
            const body = document.getElementById('modal-options-body');
            body.innerHTML = '';

            if (['burgers', 'grill'].includes(product.cat)) {
                body.innerHTML = `
                    <div class="opt-group-title">درجة الطهي / الإعداد</div>
                    <div class="opt-row"><label>مطهو جيداً (Well Done)</label><input type="radio" name="cook" value="Well Done" checked></div>
                    <div class="opt-row"><label>متوسط الطهي (Medium)</label><input type="radio" name="cook" value="Medium"></div>
                    
                    <div class="opt-group-title">إضافات اختيارية</div>
                    <div class="opt-row"><label>صوص الترفل الأسود (+35 ج.م)</label><input type="checkbox" class="cb-extra" data-name="صوص ترفل" data-price="35"></div>
                    <div class="opt-row"><label>شرائح بيكون بقر (+40 ج.م)</label><input type="checkbox" class="cb-extra" data-name="بيكون مدخن" data-price="40"></div>
                `;
            } else if (product.cat === 'pizza') {
                body.innerHTML = `
                    <div class="opt-group-title">حجم البيتزا والباستا</div>
                    <div class="opt-row"><label>الحجم القياسي</label><input type="radio" name="p-size" value="قياسي" checked></div>
                    <div class="opt-row"><label>حجم عائلي XL (+50 ج.م)</label><input type="radio" name="p-size" value="عائلي XL" data-price="50"></div>
                    
                    <div class="opt-group-title">إضافات أجبان</div>
                    <div class="opt-row"><label>أطراف محشوة جبن (+40 ج.م)</label><input type="checkbox" class="cb-extra" data-name="أطراف جبن" data-price="40"></div>
                `;
            } else {
                body.innerHTML = `<div style="color:var(--text-secondary); font-size:0.85rem; padding:10px 0;">لا توجد إضافات إضافية لهذا الصنف، سيتم إضافته فوراً للسلة.</div>`;
            }

            document.getElementById('options-modal').style.display = 'flex';
        }

        function closeOptionsModal() {
            document.getElementById('options-modal').style.display = 'none';
        }

        function addCurrentItemToCart() {
            let extras = [];
            let addedCost = 0;

            document.querySelectorAll('.cb-extra:checked').forEach(cb => {
                extras.push(cb.dataset.name);
                addedCost += parseFloat(cb.dataset.price);
            });

            const radioChecked = document.querySelector('#modal-options-body input[type="radio"]:checked');
            if (radioChecked) {
                extras.push(radioChecked.value);
                if (radioChecked.dataset.price) addedCost += parseFloat(radioChecked.dataset.price);
            }

            const totalUnitCost = activeTempItem.price + addedCost;
            const extrasStr = extras.length > 0 ? extras.join(', ') : 'بدون إضافات';

            const existingIndex = cart.findIndex(i => i.title === activeTempItem.title && i.extrasStr === extrasStr);

            if (existingIndex > -1) {
                cart[existingIndex].qty += 1;
            } else {
                cart.push({
                    title: activeTempItem.title,
                    unitPrice: totalUnitCost,
                    extrasStr: extrasStr,
                    qty: 1
                });
            }

            closeOptionsModal();
            renderCartUI();
        }

        // Cart Management
        function toggleCartDrawer(show) {
            document.getElementById('cart-drawer').style.display = show ? 'flex' : 'none';
        }

        function updateQuantity(index, delta) {
            cart[index].qty += delta;
            if (cart[index].qty <= 0) cart.splice(index, 1);
            renderCartUI();
        }

        function renderCartUI() {
            const listContainer = document.getElementById('drawer-cart-items');
            listContainer.innerHTML = '';

            let totalAcc = 0;
            let totalItemsCount = 0;

            if (cart.length === 0) {
                listContainer.innerHTML = `<div style="text-align:center; color:var(--text-secondary); margin-top:40px;">السلة فارغة حالياً 🛒</div>`;
            }

            cart.forEach((item, idx) => {
                const itemTotal = item.unitPrice * item.qty;
                totalAcc += itemTotal;
                totalItemsCount += item.qty;

                listContainer.innerHTML += `
                    <div class="cart-item">
                        <div>
                            <div style="font-size:0.88rem; font-weight:700;">${item.title}</div>
                            <div style="font-size:0.75rem; color:var(--text-secondary);">${item.extrasStr}</div>
                            <div style="font-size:0.9rem; font-weight:700; color:var(--accent-gold); margin-top:2px;">${itemTotal} ج.م</div>
                        </div>
                        <div class="quantity-controls">
                            <button class="qty-btn" onclick="updateQuantity(${idx}, -1)">-</button>
                            <span style="font-size:0.85rem; font-weight:bold; width:16px; text-align:center;">${item.qty}</span>
                            <button class="qty-btn" onclick="updateQuantity(${idx}, 1)">+</button>
                        </div>
                    </div>
                `;
            });

            document.getElementById('cart-badge-count').innerText = totalItemsCount;
            document.getElementById('drawer-item-count').innerText = totalItemsCount;
            document.getElementById('cart-bottom-total').innerText = totalAcc + " ج.م";
        }

        function processWhatsAppOrder() {
            const name = document.getElementById('c-name').value;
            const phone = document.getElementById('c-phone').value;
            const address = document.getElementById('c-address').value;

            if (cart.length === 0) {
                alert('يرجى إضافة وجبات للسلة أولاً');
                return;
            }

            if (!name || !phone || !address) {
                alert('يرجى استكمال جميع بيانات التوصيل');
                return;
            }

            let text = `👑 *طلب جديد - PRIME BITES*\n`;
            text += `--------------------------------\n`;
            text += `👤 *العميل:* ${name}\n`;
            text += `📞 *الهاتف:* ${phone}\n`;
            text += `📍 *العنوان:* ${address}\n`;
            text += `--------------------------------\n\n`;

            let grandTotal = 0;
            cart.forEach((it, i) => {
                const itemSum = it.unitPrice * it.qty;
                grandTotal += itemSum;
                text += `${i+1}. *${it.title}* (${it.qty}x)\n`;
                text += `   التفاصيل: ${it.extrasStr}\n`;
                text += `   المجموع: ${itemSum} ج.م\n\n`;
            });

            text += `--------------------------------\n`;
            text += `💰 *الإجمالي الكلي:* ${grandTotal} ج.م`;

            window.open(`https://wa.me/${WHATSAPP_NUM}?text=${encodeURIComponent(text)}`, '_blank');
        }

        // Init App
        renderCategories();
        renderProducts(productsData);
    </script>
